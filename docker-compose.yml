services:
  brain-alpha-ops:
    build: .
    image: brain-alpha-ops:0.5.0
    ports:
      - "8765:8765"
    environment:
      - BRAIN_ALPHA_OPS_EXECUTION_MODE=browser
      - BRAIN_ALPHA_OPS_WEB_FRONTEND=react
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - WEB_HOST=0.0.0.0
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - brain-alpha-artifacts:/app/artifacts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/health')"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  brain-alpha-artifacts:
