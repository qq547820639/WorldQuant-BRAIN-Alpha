services:
  brain-alpha-ops:
    build:
      context: .
      target: runtime
    image: brain-alpha-ops:0.5.0
    # F-007: bind to 127.0.0.1 on the host so the web console is reachable
    # only from the host loopback, never the public network. WEB_HOST stays
    # 0.0.0.0 *inside* the container so docker's port-forward can reach it;
    # the host-side bind is what enforces local-only access.
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      - BRAIN_ALPHA_OPS_EXECUTION_MODE=headless
      - BRAIN_ALPHA_OPS_WEB_FRONTEND=react
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - WEB_HOST=0.0.0.0
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - brain-alpha-artifacts:/app/artifacts
    # F-007: defense in depth — drop all Linux capabilities and forbid
    # privilege escalation so a compromised process cannot gain new caps.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # NOTE: read_only is incompatible with browser execution mode.
    # If BRAIN_ALPHA_OPS_EXECUTION_MODE=browser, disable read_only or add
    # tmpfs mounts for Playwright cache paths (~/.cache/ms-playwright/).
    read_only: true
    tmpfs:
      - /tmp
      - /var/tmp
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/health')"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2'

volumes:
  brain-alpha-artifacts:
