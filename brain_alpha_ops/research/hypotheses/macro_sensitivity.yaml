hypothesis:
  id: "macro_sensitivity"
  name: "Macro Sensitivity"
  category: "hybrid"
  version: "1.0.0"

  rationale:
    theory: >
      Stock returns are partially explained by sensitivities to macroeconomic factors.
      Interest rate sensitivity (duration), inflation beta, and GDP growth exposure vary
      across sectors and individual stocks. Stocks with high macro sensitivity offer
      risk premia — the cross-section of macro betas predicts future returns.
      Macro-sensitive stocks underperform during tightening cycles and outperform
      during easing, creating factor timing opportunities.
    academic_refs:
      - "Chen, Roll & Ross (1986) — Economic Forces and the Stock Market"
      - "Fama & French (1993) — Common Risk Factors in the Returns on Stocks and Bonds"
      - "Lettau & Ludvigson (2001) — Resurrecting the (C)CAPM: A Cross-Sectional Test When Risk Premia Are Time-Varying"
    behavioral_bias: ""

  field_categories:
    - category: "interest_rate_sensitivity"
      priority: P0
      examples: ["duration", "beta_to_rates", "dv01"]
    - category: "inflation_exposure"
      priority: P0
      examples: ["inflation_beta", "cpi_sensitivity", "real_estate_exposure"]
    - category: "gdp_sensitivity"
      priority: P1
      examples: ["gdp_beta", "revenue_gdp_corr", "cyclical_score"]
    - category: "currency_exposure"
      priority: P1
      examples: ["fx_beta", "revenue_foreign_pct", "export_ratio"]
    - category: "macro_momentum"
      priority: P2
      examples: ["ret_during_taper", "ret_during_easing", "ret_during_crisis"]

  expression_families:
    - id: "rate_sensitivity_sort"
      structure: "rank({duration_field} * ts_mean(returns, {WINDOW}))"
      description: "利率敏感度排序 — 高 duration 股票在加息期的超额收益"
      windows: [12, 20, 40]

    - id: "inflation_hedge"
      structure: "rank(ts_corr({FIELD_inflation}, {FIELD_returns}, {WINDOW}))"
      description: "通胀对冲能力排序 — 股价与CPI正相关的股票排序"
      windows: [20, 40, 60]

    - id: "macro_rotation"
      structure: "group_rank(ts_delta({macro_field}, {WINDOW}), {GROUP})"
      description: "宏观因子截面轮动 — 行业内对宏观因子敏感度的排序"
      windows: [4, 12, 20]

    - id: "cyclical_vs_defensive"
      structure: "rank(divide(ts_mean({cyclical_returns}, {WINDOW}), ts_std_dev({defensive_returns}, {WINDOW})))"
      description: "周期/防御股收益比 — 牛市配周期、熊市配防御的信号"
      windows: [20, 40]

  expected_failure_modes:
    - gate: "SUB_UNIVERSE_SHARPE"
      reason: "宏观 beta 因子在窄基（small cap）子样本上不显著"
      mitigation: "优先 TOP3000/TOP1000 宽基universe"

  adaptation:
    preferred_regions: ["USA", "DEV", "EUROPE"]
    preferred_universes: ["TOP3000", "TOP1000"]
    preferred_delays: [1]
