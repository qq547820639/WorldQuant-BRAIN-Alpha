hypothesis:
  id: "cross_asset_spillover"
  name: "Cross-Asset Spillover"
  category: "cross_sectional"
  version: "1.0.0"

  rationale:
    theory: >
      Asset class returns exhibit lead-lag relationships due to slow information diffusion.
      Commodity price movements predict equity returns in related sectors (e.g., oil → energy,
      metals → mining) with 1-4 week lags. Cross-asset momentum arises from segmented
      investor attention and gradual incorporation of macro signals into equity prices.
    academic_refs:
      - "Hong, Torous & Valkanov (2007) — Do Industries Lead Stock Markets?"
      - "Menzly & Ozbas (2010) — Cross-Industry Momentum"
      - "Bakshi, Gao & Rossi (2019) — Understanding the Sources of Risk Underlying the Cross Section of Commodity Returns"
    behavioral_bias: "limited_attention"

  field_categories:
    - category: "commodity_price"
      priority: P0
      examples: ["oil_price", "gold_price", "copper_price"]
    - category: "sector_performance"
      priority: P0
      examples: ["sector_return_1w", "sector_return_1m"]
    - category: "commodity_equity_correlation"
      priority: P1
      examples: ["correlation_with_oil", "beta_to_gold"]
    - category: "industry_classification"
      priority: P1
      examples: ["gics_sector", "icb_industry", "naics_code"]
    - category: "supply_chain"
      priority: P2
      examples: ["supplier_concentration", "customer_concentration"]

  expression_families:
    - id: "sector_relative_commodity"
      structure: "group_rank(ts_delta({FIELD}, {WINDOW}), {GROUP})"
      description: "行业相对商品敏感度 — 商品涨跌对应的行业截面排序"
      windows: [1, 2, 4]

    - id: "cross_asset_lead_lag"
      structure: "rank(ts_corr({commodity_field}, {equity_field}, {WINDOW}))"
      description: "商品-股票收益率相关系数 — 高敏感性行业排序"
      windows: [12, 20, 40]

    - id: "supply_chain_propagation"
      structure: "rank(ts_delta({FIELD}, {WINDOW}) * ts_std_dev({FIELD_B}, {WINDOW2}))"
      description: "供应链波动扩散 — 上游行业波动传递到下游"
      windows: [1, 2, 4]
      windows2: [12, 20]

    - id: "commodity_equity_divergence"
      structure: "rank(ts_delta({commodity_field}, {WINDOW}) - ts_delta({equity_field}, {WINDOW}))"
      description: "商品涨但股票未跟 — 信息延迟导致的套利机会"
      windows: [1, 2, 4]

  expected_failure_modes:
    - gate: "PROD_CORRELATION"
      reason: "同行业同商品信号高度相关"
      mitigation: "使用多个商品信号（oil+copper+gold）分散风险"
    - gate: "TURNOVER"
      reason: "短期信号（1周）换手率可能过高"
      mitigation: "使用2-4周窗口降低换手"

  adaptation:
    preferred_regions: ["USA", "DEV"]
    preferred_universes: ["TOP3000"]
    preferred_delays: [1]
