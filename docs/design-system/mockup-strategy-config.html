<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>策略配置 — Terminal Precision</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --surface-root:    #141311;
    --surface-1:       #1a1917;
    --surface-2:       #201f1d;
    --surface-3:       #282724;
    --surface-hover:   #2d2b28;
    --text-primary:    #e8e6e1;
    --text-secondary:  #b0ada6;
    --text-tertiary:   #78756e;
    --text-inverse:    #141311;
    --border-subtle:   #2a2824;
    --border-default:  #3a3731;
    --accent-default:  #d4991a;
    --accent-hover:    #e6a820;
    --accent-subtle:   rgba(212, 153, 26, 0.12);
    --accent-text:     #e6a820;
    --positive-default:#3d9960;
    --positive-subtle: rgba(61, 153, 96, 0.15);
    --positive-text:   #4db872;
    --negative-default:#c04040;
    --negative-subtle: rgba(192, 64, 64, 0.15);
    --negative-text:   #d45555;
    --warning-default: #b3941a;
    --warning-subtle:  rgba(179, 148, 26, 0.15);
    --warning-text:    #ccaa1f;
    --info-default:    #3d7fb8;
    --info-subtle:     rgba(61, 127, 184, 0.12);
    --info-text:       #4d94d4;
    --font-sans: 'DM Sans', system-ui, -apple-system, sans-serif;
    --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font-sans); font-size: 14px;
    background: var(--surface-root); color: var(--text-primary);
    -webkit-font-smoothing: antialiased; padding: 24px;
  }
  h1 { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
  .subtitle { font-size: 12px; color: var(--text-tertiary); margin-bottom: 20px; }
  .panel {
    background: var(--surface-1); border: 0.5px solid var(--border-subtle);
    border-radius: 6px; overflow: hidden; margin-bottom: 16px;
  }
  .panel-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px; border-bottom: 0.5px solid var(--border-subtle);
    font-size: 10px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.05em; color: var(--text-tertiary);
  }
  .panel-body { padding: 14px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .form-field { }
  .form-field label {
    display: block; font-size: 10px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.05em; color: var(--text-tertiary); margin-bottom: 5px;
  }
  .form-field select, .form-field input {
    width: 100%; padding: 8px 10px;
    background: var(--surface-2); border: 0.5px solid var(--border-default);
    border-radius: 4px; color: var(--text-primary); font-size: 13px;
    font-family: var(--font-mono); outline: none;
  }
  .form-field select:focus, .form-field input:focus { border-color: var(--accent-default); }
  .field-help { font-size: 10px; color: var(--text-tertiary); margin-top: 3px; }
  .section-title { font-size: 12px; font-weight: 600; color: var(--text-secondary); margin: 16px 0 10px; padding-bottom: 6px; border-bottom: 0.5px solid var(--border-subtle); }
  .btn {
    padding: 8px 20px; border-radius: 4px; font-size: 12px; font-weight: 600;
    border: none; cursor: pointer; font-family: var(--font-sans); margin-top: 16px;
  }
  .btn-save { background: var(--accent-default); color: var(--text-inverse); }
  .btn-save:hover { background: var(--accent-hover); }
  .toggle-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 0; border-bottom: 0.5px solid var(--border-subtle);
  }
  .toggle-row:last-child { border-bottom: none; }
  .toggle-label { font-size: 13px; color: var(--text-primary); }
  .toggle-desc { font-size: 11px; color: var(--text-tertiary); }
  .toggle {
    width: 36px; height: 20px; border-radius: 10px; position: relative;
    background: var(--surface-3); cursor: pointer; transition: background 0.2s;
    border: 0.5px solid var(--border-default); flex-shrink: 0;
  }
  .toggle.on { background: var(--positive-default); border-color: var(--positive-default); }
  .toggle::after {
    content: ''; position: absolute; width: 16px; height: 16px; border-radius: 50%;
    background: white; top: 1px; left: 1px; transition: left 0.2s;
  }
  .toggle.on::after { left: 17px; }
  .range-row { display: flex; align-items: center; gap: 10px; }
  .range-row input[type="range"] { flex: 1; accent-color: var(--accent-default); }
  .range-val { font-family: var(--font-mono); font-size: 12px; color: var(--accent-text); min-width: 36px; text-align: right; }
</style>
</head>
<body>
<h1>🎯 策略与插件设置</h1>
<div class="subtitle">助手指南 · 评分调整 · 策略插件 · 预算控制</div>

<div class="panel">
  <div class="panel-header">AI 助手指南</div>
  <div class="panel-body">
    <div class="toggle-row">
      <div>
        <div class="toggle-label">启用助手引导</div>
        <div class="toggle-desc">使用 AI 助手指导候选生成方向</div>
      </div>
      <div class="toggle on"></div>
    </div>
    <div class="toggle-row">
      <div>
        <div class="toggle-label">评分调整</div>
        <div class="toggle-desc">基于助手信心度调整先验评分</div>
      </div>
      <div class="toggle on"></div>
    </div>
    <div style="margin-top:10px">
      <div class="form-grid">
        <div class="form-field">
          <label>最小信心度阈值</label>
          <div class="range-row">
            <input type="range" min="0" max="1" step="0.05" value="0.6">
            <span class="range-val">0.60</span>
          </div>
        </div>
        <div class="form-field">
          <label>评分加成上限</label>
          <input type="number" value="4.0" step="0.5" min="0" max="10">
          <div class="field-help">助手加分上限</div>
        </div>
        <div class="form-field">
          <label>评分惩罚上限</label>
          <input type="number" value="5.0" step="0.5" min="0" max="10">
          <div class="field-help">助手减分上限</div>
        </div>
        <div class="form-field">
          <label>最小样本数</label>
          <input type="number" value="1" min="1" max="100">
          <div class="field-help">触发调整所需历史结果</div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="panel">
  <div class="panel-header">策略插件</div>
  <div class="panel-body">
    <div class="toggle-row">
      <div><div class="toggle-label">自适应策略</div><div class="toggle-desc">根据历史表现自动调整生成策略</div></div>
      <div class="toggle on"></div>
    </div>
    <div class="toggle-row">
      <div><div class="toggle-label">反过拟合检测</div><div class="toggle-desc">滚动验证 + 子宇宙 Sharpe 比率检查</div></div>
      <div class="toggle on"></div>
    </div>
    <div class="toggle-row">
      <div><div class="toggle-label">语义去重</div><div class="toggle-desc">基于因子/算子相似度去重（非简单字符串匹配）</div></div>
      <div class="toggle on"></div>
    </div>
    <div class="toggle-row">
      <div><div class="toggle-label">因子融合增强</div><div class="toggle-desc">正交化组合 + 残差 Alpha 生成</div></div>
      <div class="toggle"></div>
    </div>
  </div>
</div>

<div class="panel">
  <div class="panel-header">生成模式比例</div>
  <div class="panel-body">
    <div class="form-grid">
      <div class="form-field">
        <label>经验驱动 (Experience)</label>
        <input type="number" value="70" min="0" max="100">
        <div class="field-help">基于历史成功模式生成</div>
      </div>
      <div class="form-field">
        <label>推理驱动 (Inference)</label>
        <input type="number" value="20" min="0" max="100">
        <div class="field-help">基于经济逻辑推理生成</div>
      </div>
      <div class="form-field">
        <label>手动模式 (Manual)</label>
        <input type="number" value="10" min="0" max="100">
        <div class="field-help">用户自定义模板</div>
      </div>
    </div>
  </div>
</div>

<button class="btn btn-save">保存策略配置</button>
</body>
</html>
