<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>市场参数设置 — Terminal Precision</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --surface-root:    #141311;
    --surface-1:       #1a1917;
    --surface-2:       #201f1d;
    --surface-3:       #282724;
    --surface-hover:   #2d2b28;
    --text-primary:    #e8e6e1;
    --text-secondary:  #b0ada6;
    --text-tertiary:   #78756e;
    --text-inverse:    #141311;
    --border-subtle:   #2a2824;
    --border-default:  #3a3731;
    --accent-default:  #d4991a;
    --accent-hover:    #e6a820;
    --accent-subtle:   rgba(212, 153, 26, 0.12);
    --accent-text:     #e6a820;
    --positive-default:#3d9960;
    --positive-subtle: rgba(61, 153, 96, 0.15);
    --positive-text:   #4db872;
    --negative-default:#c04040;
    --negative-subtle: rgba(192, 64, 64, 0.15);
    --negative-text:   #d45555;
    --warning-default: #b3941a;
    --warning-subtle:  rgba(179, 148, 26, 0.15);
    --warning-text:    #ccaa1f;
    --info-default:    #3d7fb8;
    --info-subtle:     rgba(61, 127, 184, 0.12);
    --info-text:       #4d94d4;
    --font-sans: 'DM Sans', system-ui, -apple-system, sans-serif;
    --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font-sans); font-size: 14px;
    background: var(--surface-root); color: var(--text-primary);
    -webkit-font-smoothing: antialiased; padding: 24px;
  }
  h1 { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
  .subtitle { font-size: 12px; color: var(--text-tertiary); margin-bottom: 20px; }
  .panel {
    background: var(--surface-1); border: 0.5px solid var(--border-subtle);
    border-radius: 6px; overflow: hidden; margin-bottom: 16px;
  }
  .panel-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px; border-bottom: 0.5px solid var(--border-subtle);
    font-size: 10px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.05em; color: var(--text-tertiary);
  }
  .panel-body { padding: 14px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .form-field { }
  .form-field label {
    display: block; font-size: 10px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.05em; color: var(--text-tertiary); margin-bottom: 5px;
  }
  .form-field select, .form-field input {
    width: 100%; padding: 8px 10px;
    background: var(--surface-2); border: 0.5px solid var(--border-default);
    border-radius: 4px; color: var(--text-primary); font-size: 13px;
    font-family: var(--font-mono); outline: none;
  }
  .form-field select:focus, .form-field input:focus { border-color: var(--accent-default); }
  .preset-bar {
    display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap;
  }
  .preset {
    padding: 5px 12px; border-radius: 3px; font-size: 11px; font-weight: 500;
    border: 0.5px solid var(--border-default); background: transparent;
    color: var(--text-secondary); cursor: pointer; font-family: var(--font-mono);
  }
  .preset:hover { background: var(--surface-hover); }
  .preset.active { background: var(--accent-subtle); border-color: var(--accent-default); color: var(--accent-text); }
  .btn {
    padding: 8px 20px; border-radius: 4px; font-size: 12px; font-weight: 600;
    border: none; cursor: pointer; font-family: var(--font-sans); margin-top: 16px;
  }
  .btn-save { background: var(--accent-default); color: var(--text-inverse); }
  .btn-save:hover { background: var(--accent-hover); }
  .btn-reset { background: transparent; color: var(--text-secondary); border: 0.5px solid var(--border-default); margin-left: 8px; }
  .field-help { font-size: 10px; color: var(--text-tertiary); margin-top: 3px; }
  .section-title { font-size: 12px; font-weight: 600; color: var(--text-secondary); margin: 16px 0 10px; padding-bottom: 6px; border-bottom: 0.5px solid var(--border-subtle); }
</style>
</head>
<body>
<h1>⚙️ 市场参数设置</h1>
<div class="subtitle">配置 Alpha 生成和回测的市场参数 · 配置文件: config/run_config.json</div>

<div class="panel">
  <div class="panel-header">预设方案</div>
  <div class="panel-body">
    <div class="preset-bar">
      <button class="preset active">🇺🇸 US Equity TOP3000</button>
      <button class="preset">🇪🇺 EU Equity TOP500</button>
      <button class="preset">🇯🇵 JP Equity TOP1000</button>
      <button class="preset">🌍 Global TOP2000</button>
      <button class="preset">🔄 Custom</button>
    </div>
  </div>
</div>

<div class="panel">
  <div class="panel-header">市场参数</div>
  <div class="panel-body">
    <div class="form-grid">
      <div class="form-field">
        <label>资产类型 (Instrument Type)</label>
        <select><option selected>EQUITY</option><option>FUTURES</option><option>FX</option></select>
      </div>
      <div class="form-field">
        <label>区域 (Region)</label>
        <select><option selected>USA</option><option>EUR</option><option>JPN</option><option>GLOBAL</option></select>
      </div>
      <div class="form-field">
        <label>股票范围 (Universe)</label>
        <select><option selected>TOP3000</option><option>TOP2000</option><option>TOP1000</option><option>TOP500</option></select>
      </div>
      <div class="form-field">
        <label>数据延迟 (Delay)</label>
        <input type="number" value="1" min="0" max="10">
        <div class="field-help">天数 · 0 = 当日数据</div>
      </div>
      <div class="form-field">
        <label>数据集 (Dataset)</label>
        <select><option selected>pv1</option><option>pv2</option><option>experimental</option></select>
        <div class="field-help">BRAIN 平台数据集版本</div>
      </div>
      <div class="form-field">
        <label>衰减参数 (Decay)</label>
        <input type="number" value="10" min="0" max="100">
      </div>
      <div class="form-field">
        <label>中性化方式 (Neutralization)</label>
        <select><option selected>SUBINDUSTRY</option><option>INDUSTRY</option><option>SECTOR</option><option>MARKET</option></select>
      </div>
      <div class="form-field">
        <label>截尾比例 (Truncation)</label>
        <input type="number" value="0.05" step="0.01" min="0" max="0.5">
        <div class="field-help">极端收益截尾 · 0.05 = 5%</div>
      </div>
    </div>
    <div class="section-title">数据与计算</div>
    <div class="form-grid">
      <div class="form-field">
        <label>巴氏消毒 (Pasteurization)</label>
        <select><option selected>ON</option><option>OFF</option></select>
      </div>
      <div class="form-field">
        <label>单位处理 (Unit Handling)</label>
        <select><option selected>VERIFY</option><option>ON</option><option>OFF</option></select>
      </div>
      <div class="form-field">
        <label>NaN 处理</label>
        <select><option selected>ON</option><option>OFF</option></select>
      </div>
      <div class="form-field">
        <label>表达式语言</label>
        <select><option selected>FASTEXPR</option></select>
      </div>
    </div>
    <button class="btn btn-save">保存配置</button>
    <button class="btn btn-reset">恢复默认</button>
  </div>
</div>
</body>
</html>
