<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>连接与认证 — Terminal Precision</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --surface-root:    #141311;
    --surface-1:       #1a1917;
    --surface-2:       #201f1d;
    --surface-3:       #282724;
    --surface-hover:   #2d2b28;
    --surface-active:  #35332f;
    --text-primary:    #e8e6e1;
    --text-secondary:  #b0ada6;
    --text-tertiary:   #78756e;
    --text-disabled:   #55524c;
    --text-inverse:    #141311;
    --border-subtle:   #2a2824;
    --border-default:  #3a3731;
    --border-strong:   #4d4a43;
    --accent-default:  #d4991a;
    --accent-hover:    #e6a820;
    --accent-pressed:  #b38014;
    --accent-subtle:   rgba(212, 153, 26, 0.12);
    --accent-text:     #e6a820;
    --positive-default:#3d9960;
    --positive-subtle: rgba(61, 153, 96, 0.15);
    --positive-text:   #4db872;
    --negative-default:#c04040;
    --negative-subtle: rgba(192, 64, 64, 0.15);
    --negative-text:   #d45555;
    --warning-default: #b3941a;
    --warning-subtle:  rgba(179, 148, 26, 0.15);
    --warning-text:    #ccaa1f;
    --info-default:    #3d7fb8;
    --info-subtle:     rgba(61, 127, 184, 0.12);
    --info-text:       #4d94d4;
    --font-sans: 'DM Sans', system-ui, -apple-system, sans-serif;
    --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
    --sidebar-width: 220px;
    --topbar-height: 44px;
    --statusbar-height: 28px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: var(--font-sans); font-size: 14px; font-weight: 400;
    background: var(--surface-root); color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
  }
  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #3a3731; border-radius: 3px; }

  .app-shell {
    display: grid;
    grid-template-areas: "top top" "side main" "side status";
    grid-template-columns: var(--sidebar-width) 1fr;
    grid-template-rows: var(--topbar-height) 1fr var(--statusbar-height);
    height: 100vh;
  }

  .topbar {
    grid-area: top; display: flex; align-items: center; justify-content: space-between;
    padding: 0 16px; background: var(--surface-2);
    border-bottom: 0.5px solid var(--border-subtle); z-index: 100;
  }
  .topbar-left { display: flex; align-items: center; gap: 12px; }
  .topbar-breadcrumb { font-size: 12px; color: var(--text-tertiary); letter-spacing: 0.04em; }
  .topbar-breadcrumb span { color: var(--text-primary); }
  .topbar-right { display: flex; align-items: center; gap: 8px; }
  .env-badge {
    padding: 2px 8px; font-size: 10px; font-weight: 600; font-family: var(--font-mono);
    text-transform: uppercase; letter-spacing: 0.06em; border-radius: 2px;
    background: var(--positive-subtle); color: var(--positive-text);
  }

  .sidebar {
    grid-area: side; display: flex; flex-direction: column;
    background: var(--surface-1); border-right: 0.5px solid var(--border-subtle); overflow-y: auto;
  }
  .sidebar-brand {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 16px; border-bottom: 0.5px solid var(--border-subtle);
  }
  .sidebar-brand-mark {
    width: 26px; height: 26px; display: flex; align-items: center; justify-content: center;
    background: var(--accent-default); color: var(--text-inverse);
    font-family: var(--font-mono); font-size: 12px; font-weight: 600; border-radius: 2px;
  }
  .sidebar-brand-text { font-size: 13px; font-weight: 600; color: var(--text-primary); }
  .sidebar-section { padding: 14px 16px 6px; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-tertiary); }
  .sidebar-nav { display: flex; flex-direction: column; gap: 0; padding: 2px 8px; }
  .sidebar-item {
    display: flex; align-items: center; gap: 8px; padding: 7px 10px;
    font-size: 13px; color: var(--text-secondary); border-radius: 4px;
    cursor: pointer; border: none; background: none; width: 100%; text-align: left;
  }
  .sidebar-item:hover { background: var(--surface-hover); color: var(--text-primary); }
  .sidebar-item.active { background: var(--accent-subtle); color: var(--accent-text); font-weight: 500; }

  .main {
    grid-area: main; overflow-y: auto; overflow-x: hidden;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }

  .statusbar {
    grid-area: status; display: flex; align-items: center; justify-content: space-between;
    padding: 0 12px; background: var(--surface-2); border-top: 0.5px solid var(--border-subtle);
    font-size: 10px; font-family: var(--font-mono); color: var(--text-tertiary);
  }

  .connection-card {
    width: 420px;
    background: var(--surface-1);
    border: 0.5px solid var(--border-subtle);
    border-radius: 8px; overflow: hidden;
  }
  .conn-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px; border-bottom: 0.5px solid var(--border-subtle);
  }
  .conn-header h2 { font-size: 15px; font-weight: 600; }
  .conn-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--positive-default);
    animation: pulse-dot 2s ease-in-out infinite;
  }
  .conn-dot.disconnected { background: var(--negative-default); animation: none; }
  @keyframes pulse-dot { 0%,100%{opacity:1} 50%{opacity:.35} }
  .conn-body { padding: 20px; }
  .conn-field { margin-bottom: 16px; }
  .conn-field label {
    display: block; font-size: 11px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.05em; color: var(--text-tertiary); margin-bottom: 6px;
  }
  .conn-field input {
    width: 100%; padding: 10px 12px;
    background: var(--surface-3); border: 0.5px solid var(--border-default);
    border-radius: 4px; color: var(--text-primary); font-size: 14px;
    font-family: var(--font-mono); outline: none;
  }
  .conn-field input:focus { border-color: var(--accent-default); }
  .conn-field input::placeholder { color: var(--text-disabled); }
  .conn-info {
    padding: 10px 12px; margin-bottom: 16px;
    background: var(--info-subtle); border: 0.5px solid rgba(61,127,184,0.2);
    border-radius: 4px; font-size: 12px; color: var(--info-text); line-height: 1.5;
  }
  .conn-info strong { color: var(--text-primary); }
  .conn-actions { display: flex; gap: 10px; }
  .btn-primary {
    flex: 1; padding: 10px 16px;
    background: var(--accent-default); color: var(--text-inverse);
    border: none; border-radius: 4px; font-size: 13px; font-weight: 600;
    font-family: var(--font-sans); cursor: pointer;
  }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-secondary {
    flex: 1; padding: 10px 16px;
    background: transparent; color: var(--text-secondary);
    border: 0.5px solid var(--border-default); border-radius: 4px;
    font-size: 13px; font-weight: 500; cursor: pointer;
  }
  .btn-secondary:hover { background: var(--surface-hover); color: var(--text-primary); }
  .conn-status {
    margin-top: 16px; padding: 12px;
    background: var(--positive-subtle); border: 0.5px solid rgba(61,153,96,0.2);
    border-radius: 4px;
    display: flex; align-items: center; gap: 8px;
  }
  .conn-status.success { display: flex; }
  .conn-status .status-icon { color: var(--positive-text); font-size: 16px; }
  .conn-status .status-text { font-size: 13px; color: var(--positive-text); }
  .conn-status .status-detail { font-size: 11px; color: var(--text-tertiary); margin-top: 2px; }
  .env-indicator {
    display: flex; align-items: center; gap: 8px; margin-bottom: 16px;
    padding: 8px 12px; background: var(--surface-2); border-radius: 4px;
  }
  .env-indicator .env-label { font-size: 11px; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.05em; }
  .env-indicator .env-value { font-family: var(--font-mono); font-size: 12px; color: var(--positive-text); font-weight: 500; }
</style>
</head>
<body>
<div class="app-shell">
  <!-- Topbar -->
  <div class="topbar">
    <div class="topbar-left">
      <div class="topbar-breadcrumb">BRAIN Alpha Ops / <span>连接认证</span></div>
    </div>
    <div class="topbar-right">
      <div class="env-badge">PRODUCTION</div>
    </div>
  </div>

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-brand">
      <div class="sidebar-brand-mark">β</div>
      <div class="sidebar-brand-text">Alpha Ops</div>
    </div>
    <div class="sidebar-section">控制台</div>
    <div class="sidebar-nav">
      <button class="sidebar-item active">🔐 连接认证</button>
      <button class="sidebar-item">📊 仪表盘</button>
      <button class="sidebar-item">🔍 候选发现</button>
      <button class="sidebar-item">📈 评分验证</button>
      <button class="sidebar-item">🔒 提交审查</button>
    </div>
    <div class="sidebar-section">设置</div>
    <div class="sidebar-nav">
      <button class="sidebar-item">⚙️ 市场配置</button>
      <button class="sidebar-item">🎯 策略设置</button>
    </div>
  </div>

  <!-- Main -->
  <div class="main">
    <div class="connection-card">
      <div class="conn-header">
        <h2>BRAIN API 连接</h2>
        <div class="conn-dot"></div>
      </div>
      <div class="conn-body">
        <div class="env-indicator">
          <span class="env-label">运行环境</span>
          <span class="env-value">production</span>
        </div>
        <div class="conn-info">
          <strong>安全提示：</strong>凭据仅通过 HTTPS 发送至 api.worldquantbrain.com。不会写入磁盘或日志文件。
        </div>
        <div class="conn-field">
          <label>邮箱地址</label>
          <input type="email" placeholder="your_email@example.com" value="researcher@quantfund.com">
        </div>
        <div class="conn-field">
          <label>密码</label>
          <input type="password" placeholder="••••••••••••" value="••••••••••••">
        </div>
        <div class="conn-actions">
          <button class="btn-primary">测试连接</button>
          <button class="btn-secondary">清除凭据</button>
        </div>
        <div class="conn-status success">
          <span class="status-icon">✓</span>
          <div>
            <div class="status-text">认证成功</div>
            <div class="status-detail">已连接至 api.worldquantbrain.com · 账户已验证</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Statusbar -->
  <div class="statusbar">
    <span>api.worldquantbrain.com · HTTPS</span>
    <span>Session: 12h TTL</span>
  </div>
</div>
</body>
</html>
