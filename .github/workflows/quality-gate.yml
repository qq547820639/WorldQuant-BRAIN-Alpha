name: Quality Gate

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality-gate:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and dev tooling
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e ".[test]" --no-build-isolation

      - name: 0/9 - Clean stale bytecode cache
        run: find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null; find . -type f -name "*.pyc" -delete 2>/dev/null; echo "Cache cleaned"

      - name: 1/9 - Python compile check
        run: python -m compileall -q brain_alpha_ops scripts tests

      - name: 2/9 - Config validation
        run: "python -c \"from brain_alpha_ops.config import load_run_config; cfg=load_run_config('config/run_config.json'); print({'ok': True, 'environment': cfg.environment})\""

      - name: 3/9 - Dependency policy
        run: python scripts/check_dependency_policy.py --pyproject pyproject.toml --json

      - name: 3.5/9 - Frontend dependency audit
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3.5/9 - npm audit
        working-directory: brain_alpha_ops/web/react_app
        run: npm ci --ignore-scripts 2>/dev/null && npm audit --audit-level=critical
        continue-on-error: true

      - name: 4/9 - Frontend inline sync
        run: python brain_alpha_ops/build_inline.py --check --json

      - name: 5/9 - Secret scan
        run: python scripts/scan_sensitive_artifacts.py --root . --json --fail-on-findings --include-all 

      - name: 6/9 - Log redaction audit
        run: python scripts/check_log_redaction.py --root brain_alpha_ops --json

      - name: 7/9 - Module size audit
        run: python scripts/check_module_size.py --root . --json

      - name: 8/9 - Run tests with coverage
        run: python -m pytest tests/ -v --tb=short --cov=brain_alpha_ops --cov-report=term --cov-report=xml

      - name: 9/9 - Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: ${{ matrix.os }},py${{ matrix.python-version }}
        continue-on-error: true

  browser-e2e-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and test tooling
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e ".[test]" --no-build-isolation

      - name: Browser mock/readonly contract tests
        env:
          BRAIN_BROWSER_E2E_LIVE: "0"
        run: python -m pytest tests/test_browser_execution_adapter.py -v --tb=short

  frontend-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: brain_alpha_ops/web/react_app
        run: npm ci

      - name: npm audit
        working-directory: brain_alpha_ops/web/react_app
        run: npm audit --audit-level=moderate
        continue-on-error: true
