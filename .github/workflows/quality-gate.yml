name: Quality Gate

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality-gate:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and dev tooling
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e ".[test]" --no-build-isolation

      - name: 0/9 - Clean stale bytecode cache
        run: find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null; find . -type f -name "*.pyc" -delete 2>/dev/null; echo "Cache cleaned"

      - name: 1/9 - Python compile check
        run: python -m compileall -q brain_alpha_ops scripts tests

      - name: 2/9 - Config validation
        run: "python -c \"from brain_alpha_ops.config import load_run_config; cfg=load_run_config('config/run_config.json'); print({'ok': True, 'environment': cfg.environment})\""

      - name: 3/9 - Dependency policy
        run: python scripts/check_dependency_policy.py --pyproject pyproject.toml --json

      - name: 3.5/9 - Frontend dependency audit
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3.5/9 - npm audit
        working-directory: brain_alpha_ops/web/react_app
        run: npm ci --ignore-scripts 2>/dev/null && npm audit --audit-level=critical

      - name: 4/9 - Frontend inline sync
        run: python brain_alpha_ops/build_inline.py --check --json

      - name: 5/9 - Secret scan
        run: python scripts/scan_sensitive_artifacts.py --root . --json --fail-on-findings --include-all 

      - name: 6/9 - Log redaction audit
        run: python scripts/check_log_redaction.py --root brain_alpha_ops --json

      - name: 7/9 - Module size audit
        run: python scripts/check_module_size.py --root . --json

      - name: 7.5/9 - BRAIN capability registry check
        run: python scripts/check_capability_registry.py --json

      - name: 7.6/9 - BRAIN contract check
        run: python scripts/check_brain_contract.py --json

      - name: 7.7/9 - pip audit (high/critical blocking)
        run: |
          python -m pip install pip-audit 2>/dev/null || true
          python -m pip_audit --disable-pip --requirement requirements.lock --strict || \
            { echo "::error::pip-audit found high/critical vulnerabilities in runtime dependencies"; exit 1; }

      - name: 8/9 - Run tests with coverage
        run: python -m pytest tests/ -v --tb=short --cov=brain_alpha_ops --cov-report=term --cov-report=xml

      - name: 9/9 - Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: ${{ matrix.os }},py${{ matrix.python-version }}
        continue-on-error: true

  browser-e2e-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and test tooling
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e ".[test]" --no-build-isolation

      - name: Browser mock/readonly contract tests
        env:
          BRAIN_BROWSER_E2E_LIVE: "0"
        run: python -m pytest tests/test_browser_execution_adapter.py -v --tb=short

      - name: E2E smoke (mock mode - mandatory gate)
        env:
          BRAIN_BROWSER_E2E_LIVE: "0"
        run: python -m pytest tests/e2e/test_real_web_flow.py -v --tb=short

      - name: E2E smoke (live mode - conditional on BRAIN credentials)
        if: ${{ env.BRAIN_USERNAME != '' && env.BRAIN_PASSWORD != '' }}
        env:
          BRAIN_BROWSER_E2E_LIVE: "1"
        run: |
          echo "Live BRAIN credentials present - running live smoke."
          python -m pytest tests/e2e/test_real_web_flow.py -v --tb=short
      - name: E2E smoke (live mode - skipped, credentials not provided)
        if: ${{ !(env.BRAIN_USERNAME != '' && env.BRAIN_PASSWORD != '') }}
        run: |
          echo "::warning::Live BRAIN smoke skipped: BRAIN_USERNAME/BRAIN_PASSWORD not provided. Mock-mode E2E already ran as the mandatory gate."

  frontend-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: brain_alpha_ops/web/react_app/package-lock.json

      - name: Install frontend dependencies
        working-directory: brain_alpha_ops/web/react_app
        run: npm ci

      - name: F3.1 - Type check (tsc -b)
        working-directory: brain_alpha_ops/web/react_app
        run: npm run typecheck

      - name: F3.2 - Lint (eslint)
        working-directory: brain_alpha_ops/web/react_app
        run: npm run lint

      - name: F3.3 - Format check (prettier)
        working-directory: brain_alpha_ops/web/react_app
        run: npm run format:check

      - name: F3.4 - Unit tests (vitest run)
        working-directory: brain_alpha_ops/web/react_app
        run: npm run test

      - name: npm audit (advisory)
        working-directory: brain_alpha_ops/web/react_app
        run: npm audit --audit-level=high

  release-readiness:
    # Aggregator gate: succeeds ONLY when every mandatory job succeeds.
    # Any required job failing (or being cancelled) blocks this job, so the
    # overall CI status reflects true release readiness.
    needs: [quality-gate, browser-e2e-contract, frontend-quality]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check required jobs
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "::error::release-readiness FAILED: one or more mandatory jobs did not succeed."
          echo "quality-gate=${{ needs.quality-gate.result }}"
          echo "browser-e2e-contract=${{ needs.browser-e2e-contract.result }}"
          echo "frontend-quality=${{ needs.frontend-quality.result }}"
          exit 1
      - name: All mandatory jobs passed
        if: ${{ !cancelled() && !(contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
        run: echo "release-readiness PASSED: all mandatory jobs are green."
